<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="1360" viewBox="0 0 1200 1360"
     role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">《辅行诀脏腑用药法要》汤液经法图高清重绘</title>
  <desc id="chart-desc">五边形分区图。木、火、土、金、水五区分别列出用、体、化关系；外圈五除为相邻五味配伍关系；下方列阳进为补与阴退为泻两条方向规则。</desc>

  <metadata>
    依据 refs/gem/05_辅行诀.pdf 第17页重绘，并以知识库文字本复核。
    本图是便于阅读和检索的编辑性重绘，不是原书影摹本。
  </metadata>

  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#243247" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#273445"/>
    </marker>
    <style>
      .han { font-family: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", STSong, serif; }
      .sans { font-family: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", sans-serif; }
      .outline { fill: none; stroke: #344054; stroke-width: 4; stroke-linejoin: round; }
      .divider { fill: none; stroke: #667085; stroke-width: 3; stroke-linecap: round; }
      .element { font-size: 42px; font-weight: 700; fill: #17212f; text-anchor: middle; }
      .relation { font-size: 25px; font-weight: 600; fill: #273445; text-anchor: middle; letter-spacing: 1px; }
      .caption { font-size: 22px; fill: #475467; }
      .note { font-size: 20px; fill: #475467; }
      .rule-head { font-size: 32px; font-weight: 700; fill: #17212f; }
      .rule-text { font-size: 26px; fill: #273445; }
    </style>
  </defs>

  <rect width="1200" height="1360" fill="#fbfaf7"/>

  <g class="han" text-anchor="middle">
    <text x="600" y="82" font-size="50" font-weight="700" fill="#17212f">汤液经法图</text>
    <text x="600" y="126" class="caption sans">据《辅行诀脏腑用药法要》核心组方图重绘 · 结构化阅读版</text>
  </g>

  <g filter="url(#soft-shadow)">
    <!-- 五个分区依原图顺序排列：火、土、金、水、木。颜色仅为现代阅读辅助。 -->
    <polygon points="250,505 600,250 600,500 488,581"
             fill="#f8d8d2" stroke="#fbfaf7" stroke-width="3"/>
    <polygon points="600,250 950,505 712,581 600,500"
             fill="#f1dfaa" stroke="#fbfaf7" stroke-width="3"/>
    <polygon points="950,505 816,917 669,713 712,581"
             fill="#e3e7eb" stroke="#fbfaf7" stroke-width="3"/>
    <polygon points="816,917 384,917 531,713 669,713"
             fill="#d9e8f2" stroke="#fbfaf7" stroke-width="3"/>
    <polygon points="384,917 250,505 488,581 531,713"
             fill="#dcebd8" stroke="#fbfaf7" stroke-width="3"/>
  </g>

  <!-- 原图的三重五边形骨架。 -->
  <polygon class="outline" points="600,250 950,505 816,917 384,917 250,505"/>
  <polygon class="outline" points="600,370 836,542 746,820 454,820 364,542"/>
  <polygon class="outline" points="600,500 712,581 669,713 531,713 488,581" fill="#fbfaf7"/>
  <path class="divider" d="M600 250 L600 500 M950 505 L712 581 M816 917 L669 713 M384 917 L531 713 M250 505 L488 581"/>

  <!-- 关系文字全部保持水平，避免原扫描图中旋转文字难以检索。 -->
  <g class="han">
    <g transform="translate(480 438)">
      <text class="element" y="0">火</text>
      <text class="relation" y="42">用 咸　｜　体 苦</text>
      <text class="relation" y="80">化 酸</text>
    </g>
    <g transform="translate(720 438)">
      <text class="element" y="0">土</text>
      <text class="relation" y="42">用 甘　｜　体 辛</text>
      <text class="relation" y="80">化 苦</text>
    </g>
    <g transform="translate(806 656)">
      <text class="element" y="0">金</text>
      <text class="relation" y="42">用 酸　｜　体 咸</text>
      <text class="relation" y="80">化 辛</text>
    </g>
    <g transform="translate(600 796)">
      <text class="element" y="0">水</text>
      <text class="relation" y="42">用 苦　｜　体 甘</text>
      <text class="relation" y="80">化 咸</text>
    </g>
    <g transform="translate(394 656)">
      <text class="element" y="0">木</text>
      <text class="relation" y="42">用 辛　｜　体 酸</text>
      <text class="relation" y="80">化 甘</text>
    </g>
  </g>

  <g class="sans">
    <rect x="208" y="984" width="360" height="190" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M260 1082 C260 1028 330 1028 330 1082"
          fill="none" stroke="#273445" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-dark)"/>
    <text x="295" y="1134" class="rule-head" text-anchor="middle">左</text>
    <text x="450" y="1046" class="rule-text" text-anchor="middle">阳进为补</text>
    <text x="450" y="1084" class="rule-text" text-anchor="middle">其数七</text>
    <text x="450" y="1122" class="rule-text" text-anchor="middle">火数也</text>

    <rect x="632" y="984" width="360" height="190" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M940 1082 C940 1028 870 1028 870 1082"
          fill="none" stroke="#273445" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-dark)"/>
    <text x="905" y="1134" class="rule-head" text-anchor="middle">右</text>
    <text x="750" y="1046" class="rule-text" text-anchor="middle">阴退为泻</text>
    <text x="750" y="1084" class="rule-text" text-anchor="middle">其数六</text>
    <text x="750" y="1122" class="rule-text" text-anchor="middle">水数也</text>
  </g>

  <g class="sans">
    <line x1="170" y1="1218" x2="1030" y2="1218" stroke="#d0d5dd" stroke-width="2"/>
    <text x="170" y="1258" class="note">校记：范抄本原图“阴进为泻”，据《传承集》校作“阴退为泻”，本图采用校正文字。</text>
    <text x="600" y="1294" class="note" text-anchor="middle">五除：辛苦除痞 · 咸辛除滞 · 甘咸除燥 · 酸甘除□* · 苦酸除烦</text>
    <text x="600" y="1330" class="note" text-anchor="middle">*酸甘所除一字依当前原图转录保留为“□”，运行时不自动指定。颜色、横排与版式为重绘所加。</text>
  </g>
</svg>
